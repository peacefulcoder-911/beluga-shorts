name: 10x Daily Beluga Shorts Automation

on:
  schedule:
    # 10 Peak Global Slots (Spaced every ~1h45m across peak viewing windows)
    - cron: '30 2 * * *'   # Slot 1:  08:00 AM IST (Asia morning wakeup)
    - cron: '15 4 * * *'   # Slot 2:  09:45 AM IST (Mid-morning surge)
    - cron: '0 6 * * *'    # Slot 3:  11:30 AM IST (Pre-lunch / Europe morning)
    - cron: '45 7 * * *'   # Slot 4:  01:15 PM IST (Lunchtime peak / Europe commute)
    - cron: '30 9 * * *'   # Slot 5:  03:00 PM IST (Afternoon break / Europe lunch)
    - cron: '15 11 * * *'  # Slot 6:  04:45 PM IST (School out / US East morning)
    - cron: '0 13 * * *'   # Slot 7:  06:30 PM IST (Evening commute / US East lunch)
    - cron: '45 14 * * *'  # Slot 8:  08:15 PM IST (Prime evening / Europe evening)
    - cron: '30 16 * * *'  # Slot 9:  10:00 PM IST (Night relaxation / US East afternoon)
    - cron: '15 18 * * *'  # Slot 10: 11:45 PM IST (Midnight scroll / US peak prime)
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Daily Generation, Render & Upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: node runDaily.js

      - name: Commit and Push Updated Story History
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add history.json
          git commit -m "chore: record uploaded short to history [skip ci]" || echo "No changes to commit"
          git push origin main
