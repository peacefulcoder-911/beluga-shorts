name: 6x Daily Beluga Shorts Automation (2K QHD)

on:
  schedule:
    # 6 Peak Global YouTube Shorts Windows (Optimally Spaced Every 3-4 Hours)
    - cron: '30 2 * * *'   # Slot 1: 08:00 AM IST (02:30 UTC) - Asia morning wakeup & commute
    - cron: '30 7 * * *'   # Slot 2: 01:00 PM IST (07:30 UTC) - Asia lunchtime & Europe morning wakeup
    - cron: '0 11 * * *'   # Slot 3: 04:30 PM IST (11:00 UTC) - Europe afternoon & UK school out
    - cron: '30 14 * * *'  # Slot 4: 08:00 PM IST (14:30 UTC) - Europe prime evening & US East morning
    - cron: '0 18 * * *'   # Slot 5: 11:30 PM IST (18:00 UTC) - US East lunchtime & US West morning
    - cron: '30 20 * * *'  # Slot 6: 02:00 AM IST (20:30 UTC) - US peak prime evening
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Daily 2K Generation, Render & Upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: node runDaily.js

      - name: Commit and Push Updated Story History & Generated Assets
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add history.json public/characters/ public/attachments/ || true
          git commit -m "chore: record uploaded 2K short to history [skip ci]" || echo "No changes to commit"
          git push origin main
