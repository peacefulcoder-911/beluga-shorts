name: Beluga 3x Daily Automated 2K Short Publisher

on:
  schedule:
    # 3 Daily Uploads at peak engagement hours (IST):
    # 1. 01:00 PM IST (07:30 UTC) - Lunch / Afternoon Peak
    - cron: '30 7 * * *'
    # 2. 09:00 PM IST (15:30 UTC) - Post-Dinner Evening Prime Peak
    - cron: '30 15 * * *'
    # 3. 02:00 AM IST (20:30 UTC) - Late Night / US Morning Peak
    - cron: '30 20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write
  issues: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Daily 2K Generation, Render & Upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: node runDaily.js

      - name: Commit and Push Updated Story History & Generated Assets
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add history.json latest_upload.json public/characters/ public/attachments/ public/trending/ || true
          git commit -m "chore: record uploaded 2K short to history [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Send GitHub Upload Verification Notification
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "latest_upload.json" ]; then
            VIDEO_TITLE=$(node -e "console.log(require('./latest_upload.json').videoTitle || require('./latest_upload.json').title)")
            VIDEO_URL=$(node -e "console.log(require('./latest_upload.json').videoUrl)")
            UPLOAD_TIME=$(node -e "console.log(require('./latest_upload.json').uploadedAt)")

            echo "### 🎬 YouTube Short Upload Verified!" >> $GITHUB_STEP_SUMMARY
            echo "- **Title:** ${VIDEO_TITLE}" >> $GITHUB_STEP_SUMMARY
            echo "- **Watch Link:** [${VIDEO_URL}](${VIDEO_URL})" >> $GITHUB_STEP_SUMMARY
            echo "- **Uploaded At:** ${UPLOAD_TIME}" >> $GITHUB_STEP_SUMMARY
            echo "- **Quality:** 2K QHD (9:16 Vertical Short)" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** Published & Live on YouTube ✅" >> $GITHUB_STEP_SUMMARY

            ISSUE_BODY=$(printf "### 🎬 YouTube Short Uploaded & Live!\n\n- **Title:** %s\n- **Watch Link:** %s\n- **Uploaded At:** %s\n- **Format:** 2K QHD (1080x1920) Vertical Short\n- **Status:** Live & Public ✅\n\n---\n*Automatic verification notification dispatched by GitHub Actions.*" "$VIDEO_TITLE" "$VIDEO_URL" "$UPLOAD_TIME")
            # Create GitHub Issue for instant mobile push & email notification to repo owner
            gh issue create \
              --title "🚀 YouTube Short Published: ${VIDEO_TITLE}" \
              --body "${ISSUE_BODY}" || true
          fi
