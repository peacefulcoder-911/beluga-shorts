name: Beluga Daily Automated Long-Form Episode Publisher

on:
  schedule:
    # 1 Daily Long-Form Full Episode in the evening:
    # 07:00 PM IST (13:30 UTC) - Prime Time Evening
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write
  issues: write

jobs:
  build-and-upload-longform:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Daily Long-Form Generation, Render & Upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: node longform/scripts/runLongform.js

      - name: Commit and Push Updated Long-Form History & Assets
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add longform/data/history_longform.json public/attachments/ public/characters/ || true
          git commit -m "chore: record uploaded long-form episode to history [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Send GitHub Long-Form Upload Verification Notification
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "latest_upload_longform.json" ]; then
            VIDEO_TITLE=$(node -e "console.log(require('./latest_upload_longform.json').title)")
            VIDEO_URL=$(node -e "console.log(require('./latest_upload_longform.json').videoUrl)")
            UPLOAD_TIME=$(node -e "console.log(require('./latest_upload_longform.json').uploadedAt)")

            echo "### 🎬 YouTube Long-Form Episode Upload Verified!" >> $GITHUB_STEP_SUMMARY
            echo "- **Title:** ${VIDEO_TITLE}" >> $GITHUB_STEP_SUMMARY
            echo "- **Watch Link:** [${VIDEO_URL}](${VIDEO_URL})" >> $GITHUB_STEP_SUMMARY
            echo "- **Uploaded At:** ${UPLOAD_TIME}" >> $GITHUB_STEP_SUMMARY
            echo "- **Format:** 1080p Landscape Full Episode" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** Published & Live on YouTube ✅" >> $GITHUB_STEP_SUMMARY

            ISSUE_BODY=$(printf "### 🎬 YouTube Long-Form Episode Live!\n\n- **Title:** %s\n- **Watch Link:** %s\n- **Uploaded At:** %s\n- **Format:** 1080p Landscape Full Episode\n- **Status:** Live & Public ✅\n\n---\n*Automatic verification notification dispatched by GitHub Actions.*" "$VIDEO_TITLE" "$VIDEO_URL" "$UPLOAD_TIME")
            gh issue create \
              --title "🚀 Long-Form Episode Published: ${VIDEO_TITLE}" \
              --body "${ISSUE_BODY}" || true
          fi
