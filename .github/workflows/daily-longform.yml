name: Daily Beluga Long-Form Automation (Full Episode)

on:
  # Schedule disabled per user request: long-form videos on hold
  # schedule:
  #   - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime if needed

permissions:
  contents: write

jobs:
  build-and-upload-longform:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Daily Long-Form Generation, Render & Upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: node longform/scripts/runLongform.js

      - name: Commit and Push Updated Long-Form History & Assets
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add longform/data/history_longform.json public/attachments/ public/characters/ || true
          git commit -m "chore: record uploaded long-form episode to history [skip ci]" || echo "No changes to commit"
          git push origin main
